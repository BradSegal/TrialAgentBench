[project]
name = "trialagentbench-verifier"
version = "1.1.0"
description = "Independent released-byte verification and normalized score replay for TrialAgentBench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Segal" }]
maintainers = [{ name = "Bradley Segal" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "lifelines>=0.30,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<2.4",
  "pandas>=2.2,<3",
  "packaging>=24,<27",
  "pyarrow>=18,<24",
  "pydantic>=2.12,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15",
]

[project.scripts]
trialagentbench-verify = "trialagentbench_verifier.cli:main"

[project.urls]
Homepage = "https://huggingface.co/datasets/BradSegal/TrialAgentBench/"
Harness = "https://github.com/BradSegal/TrialAgentBench"
Data = "https://huggingface.co/datasets/BradSegal/TrialAgentBench/"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pip>=24",
  "pytest>=9.0.3,<10",
  "ruff>=0.6",
  "scipy-stubs>=1.14,<1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trialagentbench_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"examples/scientific/review_standards.py" = "trialagentbench_verifier/resources/review_standards.py"

[tool.hatch.build.targets.sdist]
include = ["/CITATION.cff", "/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests", "/examples"]
exclude = [
  "/.venv", "/.mypy_cache", "/.pytest_cache", "/.ruff_cache", "/dist", "**/__pycache__",
  "/examples/scientific/*-records.zip",
]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042", "UP047"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "lifelines", "lifelines.*",
  "pyarrow", "pyarrow.*",
  "statsmodels", "statsmodels.*",
  "yaml", "yaml.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-p", "no:cacheprovider"]
markers = [
  "executor: real-container checks for public offline execution",
  "slow: distribution-build and installed-artifact checks",
]
